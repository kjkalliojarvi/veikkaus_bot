name: fi-se data load

on:
  schedule:
    - cron: '55 21 * * *'

  workflow_dispatch:

jobs:
  fi_se_load:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: 3.14

      - name: Install dependencies
        run: |
          uv sync --frozen
          mkdir data

      - name: Load data
        run: |
          uv run python veikkaus_bot/get_data_json.py

      - name: Load into SQLite
        run: |
          uv run veikkaus load data/*.json --db data/veikkaus_data.db

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: data upload
          path: data
