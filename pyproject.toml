[project]
name = "veikkaus-bot"
version = "0.1.0"
description = "Veikkaus bot"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "kk", email = "kari.kalliojarvi@kolumbus.fi" },
]
keywords = ["Veikkaus", "bot"]
requires-python = ">=3.14"
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "pydantic>=2.13.4",
    "requests>=2.34.2",
    "python-dotenv>=1.2.2",
    "beautifulsoup4>=4.15.0",
    "lxml>=6.1.1",
    "duckdb>=1.5.5",
    "textual>=8.2.8",
]

[project.urls]
Homepage = "https://github.com/kjkalliojarvi/veikkaus_bot"

[project.scripts]
veikkaus = "veikkaus_bot.__main__:veikkaus"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["veikkaus_bot"]
